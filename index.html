            --text-main: #111111;
            --white: #FFFFFF;

        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            /* Fondo de cuadrícula (Grid) como en tu imagen */
            background-image: linear-gradient(var(--grid-color) 1px, transparent 1px),
                              linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 30px 30px;
            display: flex;
            flex-direction: column;
        }

        /* --- PANTALLAS --- */
        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            background: transparent;
        }

        .hide { transform: translateX(100%); pointer-events: none; }
        .active { transform: translateX(0); }
        .screen-left { transform: translateX(-100%); pointer-events: none; }

        /* --- MENÚ PRINCIPAL --- */
        .brand-box {
            background-color: var(--primary);
            color: var(--white);
            padding: 20px 40px;
            margin-bottom: 40px;
            transform: rotate(-2deg);
            box-shadow: 10px 10px 0px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            font-weight: 900;
            margin: 0;
            letter-spacing: -1px;
            line-height: 0.9;
            text-align: center;
        }

        .subtitle {
            font-size: 0.9rem;
            margin-top: 5px;
            opacity: 0.9;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 85%;
            max-width: 350px;
        }

        .menu-btn {
            background: var(--white);
            border: 2px solid var(--text-main);
            padding: 20px;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 5px 5px 0px var(--text-main);
            transition: transform 0.1s, box-shadow 0.1s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-main);
        }

        .menu-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 3px 3px 0px var(--text-main);
        }

        .icon { font-size: 1.5rem; }

        /* Estilos específicos de botones */
        .btn-juicio:hover { background: #ffcccc; }
        .btn-victima:hover { background: #ccffcc; }
        .btn-detonacion:hover { background: #ccccff; }
        .btn-dilema:hover { background: #ffffcc; }

        /* --- PANTALLA DE JUEGO --- */
        .game-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .back-btn {
            background: transparent;
            border: none;
            font-weight: 900;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--primary);
        }

        .category-tag {
            background: var(--primary);
            color: white;
            padding: 5px 15px;
            font-weight: bold;
            font-size: 0.8rem;
            border-radius: 50px;
            text-transform: uppercase;
        }

        .card-container {
            width: 85%;
            max-width: 400px;
            perspective: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            background: var(--white);
            border: 3px solid var(--primary);
            width: 100%;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 15px 15px 0px rgba(0, 51, 255, 0.2);
            margin-bottom: 30px;
            position: relative;
        }

        .card-text {
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        /* Estilo DILEMA */
        .option-a { color: var(--primary); }
        .divider { margin: 15px 0; font-size: 0.8rem; opacity: 0.5; font-weight: bold; }
        .option-b { color: var(--text-main); }

        .next-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 18px 60px;
            border-radius: 50px; /* Pill shape como en tu foto */
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 51, 255, 0.3);
            transition: transform 0.1s;
        }

        .next-btn:active { transform: scale(0.95); }

        /* Contador para DETONACION */
        #timer {
            font-size: 3rem;
            font-weight: 900;
            color: var(--primary);
            margin-top: 10px;
            display: none;
        }

    </style>
</head>

        let currentList = [];

        const actionBtn = document.getElementById('action-btn');
        const timerDisplay = document.getElementById('timer');
        const mainCard = document.getElementById('main-card');

        function startGame(mode) {
            currentMode = mode;
            currentList = [...db[mode]]; // Copia fresca
            
            // Configurar textos
            let title = "";
            if(mode === 'juicio') title = "EL JUICIO";
            if(mode === 'victima') title = "LA VÍCTIMA";
            if(mode === 'detonacion') title = "DETONACIÓN";
            if(mode === 'dilema') title = "DILEMA";
            
            catDisplay.innerText = title;

            // Animación cambio pantalla
            menuScreen.classList.remove('active');
            menuScreen.classList.add('screen-left');
            gameScreen.classList.remove('hide');
            gameScreen.classList.add('active');

            nextCard();
        }

        function goBack() {
            clearInterval(timerInterval);
            timerDisplay.style.display = 'none';
            gameScreen.classList.remove('active');
            gameScreen.classList.add('hide');
            menuScreen.classList.remove('screen-left');
            menuScreen.classList.add('active');
        }

        function nextCard() {
            // Animación de tarjeta
            mainCard.style.transform = "scale(0.95)";
            setTimeout(() => mainCard.style.transform = "scale(1)", 100);

            // Reiniciar timer si existe
            clearInterval(timerInterval);
            timerDisplay.style.display = 'none';
            actionBtn.innerText = "SIGUIENTE";

            // Elegir aleatorio
            const randomIndex = Math.floor(Math.random() * currentList.length);
            const item = currentList[randomIndex];

            // Renderizar contenido
            if (currentMode === 'dilema') {
                cardContent.innerHTML = `
                    <div class="option-a">${item.a}</div>
                    <div class="divider">O PREFIERES</div>
                    <div class="option-b">${item.b}</div>
                `;
            } else {
                cardContent.innerText = item;
            }

            // Lógica especial DETONACION (Timer)
            if (currentMode === 'detonacion') {
                actionBtn.innerText = "¡TIEMPO!";
                timerDisplay.style.display = 'block';
                let timeLeft = 10;
                timerDisplay.innerText = timeLeft;
                
                timerInterval = setInterval(() => {
                    timeLeft--;
                    timerDisplay.innerText = timeLeft;
                    if(timeLeft <= 0) {
                        clearInterval(timerInterval);
                        timerDisplay.innerText = "¡BOOM!";
                        navigator.vibrate([200, 100, 200]); // Vibrar celular
                    }
                }, 1000);
            }
        }
