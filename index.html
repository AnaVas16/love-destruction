    <style>
        :root {
            --primary: #0033FF; /* Azul Eléctrico */
            --bg-color: #F0F0F0;
            --grid-color: #DCDCDC;
            --text-main: #111111;
            --white: #FFFFFF;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            /* Fondo de cuadrícula estilo Swiss */
            background-image: linear-gradient(var(--grid-color) 1px, transparent 1px),
                              linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 30px 30px;
            display: flex;
            flex-direction: column;
        }

        /* --- PANTALLAS --- */
        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            background: transparent;
        }

        .hide { transform: translateX(100%); pointer-events: none; }
        .active { transform: translateX(0); }
        .screen-left { transform: translateX(-100%); pointer-events: none; }

        /* --- MENÚ PRINCIPAL --- */
        .brand-box {
            background-color: var(--primary);
            color: var(--white);
            padding: 20px 40px;
            margin-bottom: 40px;
            transform: rotate(-2deg);
            box-shadow: 10px 10px 0px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            font-weight: 900;
            margin: 0;
            letter-spacing: -1px;
            line-height: 0.9;
        }

        .subtitle {
            font-size: 0.9rem;
            margin-top: 5px;
            opacity: 0.9;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 85%;
            max-width: 350px;
        }

        .menu-btn {
            background: var(--white);
            border: 2px solid var(--text-main);
            padding: 20px;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 5px 5px 0px var(--text-main);
            transition: transform 0.1s, box-shadow 0.1s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-main);
        }

        .menu-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 3px 3px 0px var(--text-main);
        }

        .icon { font-size: 1.5rem; }

        .game-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
