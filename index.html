<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Party Game App</title>
    <style>
        /* --- ESTILOS VISUALES (CSS) --- */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --cat1: #ff4757; /* Rojo */
            --cat2: #2ed573; /* Verde */
            --cat3: #ffa502; /* Naranja */
            --cat4: #3742fa; /* Azul */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Pantallas */
        .screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: absolute;
            transition: transform 0.3s ease-in-out;
        }

        .hide { transform: translateX(100%); }
        .active { transform: translateX(0); }

        /* Menú Principal */
        h1 { margin-bottom: 30px; font-size: 2.5rem; text-transform: uppercase; letter-spacing: 2px; }
        
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 90%;
            max-width: 400px;
        }

        .menu-btn {
            height: 120px;
            border: none;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .menu-btn:active { transform: scale(0.95); }
        .menu-btn span { font-size: 2rem; margin-bottom: 5px; }

        /* Botones de Categoría */
        .btn-senala { background: var(--cat1); }
        .btn-rapido { background: var(--cat2); }
        .btn-elige { background: var(--cat3); }
        .btn-probable { background: var(--cat4); }

        /* Pantalla de Juego */
        .game-header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        .back-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1rem;
            cursor: pointer;
        }

        .card-container {
            width: 85%;
            max-width: 400px;
            height: 60%;
            perspective: 1000px;
        }

        .card {
            width: 100%;
            height: 100%;
            background: var(--card-bg);
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.1);
            position: relative;
        }

        .card-category {
            text-transform: uppercase;
            font-size: 0.9rem;
            opacity: 0.6;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .card-text {
            font-size: 2rem;
            line-height: 1.4;
        }

        /* Estilo especial para "Elige" */
        .option-a { color: var(--cat3); }
        .vs { font-size: 0.8rem; margin: 10px 0; opacity: 0.5; }
        .option-b { color: white; }

        /* Botón Siguiente */
        .next-btn {
            margin-top: 40px;
            padding: 15px 50px;
            border-radius: 50px;
            border: none;
            background: white;
            color: black;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        
        .next-btn:active { background: #ddd; }

    </style>
</head>
<body>

    <div id="menu-screen" class="screen active">
        <h1>PARTY APP</h1>
        <div class="menu-grid">
            <button class="menu-btn btn-senala" onclick="startGame('senala')">
                <span>👇</span>Señala
            </button>
            <button class="menu-btn btn-rapido" onclick="startGame('rapido')">
                <span>⏱️</span>El Rápido
            </button>
            <button class="menu-btn btn-elige" onclick="startGame('elige')">
                <span>⚖️</span>Elige
            </button>
            <button class="menu-btn btn-probable" onclick="startGame('probable')">
                <span>🤔</span>Probable
            </button>
        </div>
        <p style="margin-top:30px; opacity:0.5; font-size:0.8rem;">Hecho para divertirse</p>
    </div>

    <div id="game-screen" class="screen hide">
        <div class="game-header">
            <button class="back-btn" onclick="goBack()">← Salir</button>
        </div>

        <div class="card-container">
            <div class="card" id="card">
                <div class="card-category" id="cat-label">CATEGORÍA</div>
                <div class="card-text" id="card-content">
                    Presiona Siguiente
                </div>
            </div>
        </div>

        <button class="next-btn" onclick="nextCard()">Siguiente ↻</button>
    </div>

    <script>
        /* --- LÓGICA DEL JUEGO (JAVASCRIPT) --- */

        // 1. BASE DE DATOS DE PREGUNTAS
        const data = {
            senala: [
                "Yo nunca he fingido estar enfermo para faltar al trabajo.",
                "Yo nunca he stalkeado a mi ex.",
                "Yo nunca he salido de fiesta dos días seguidos.",
                "Yo nunca he robado algo de un hotel.",
                "Yo nunca he besado a alguien en este cuarto.",
                "Yo nunca he enviado un mensaje borracho del que me arrepentí."
            ],
            rapido: [
                "Nombra 5 marcas de cerveza.",
                "Nombra 5 películas de Disney.",
                "Nombra 5 cosas que encontrarías en un baño.",
                "Nombra 5 capitales de Europa.",
                "Nombra 5 ingredientes de una pizza.",
                "Nombra 5 canciones de Reggaetón."
            ],
            elige: [
                { a: "Ser invisible", b: "Poder volar" },
                { a: "Tener dinero infinito", b: "Tener amor verdadero" },
                { a: "No volver a usar internet", b: "No volver a salir de casa" },
                { a: "Saber cuándo morirás", b: "Saber cómo morirás" },
                { a: "Pizza con piña", b: "Pizza sin queso" }
            ],
            probable: [
                "¿Quién es más probable que termine en la cárcel?",
                "¿Quién es más probable que se vuelva millonario?",
                "¿Quién es más probable que llore en una película?",
                "¿Quién es más probable que sobreviva a un apocalipsis zombie?",
                "¿Quién es más probable que se case primero?",
                "¿Quién es más probable que pierda el celular en la fiesta?"
            ]
        };

        // Variables de estado
        let currentMode = '';
        const menuScreen = document.getElementById('menu-screen');
        const gameScreen = document.getElementById('game-screen');
        const cardContent = document.getElementById('card-content');
        const catLabel = document.getElementById('cat-label');
        const cardBox = document.getElementById('card');

        // Función para iniciar juego
        function startGame(mode) {
            currentMode = mode;
            
            // Configurar colores según el modo
            let color = '';
            let label = '';
            if(mode === 'senala') { color = 'var(--cat1)'; label = 'Señala con el dedo'; }
            if(mode === 'rapido') { color = 'var(--cat2)'; label = 'El Rápido (5 Cosas)'; }
            if(mode === 'elige') { color = 'var(--cat3)'; label = '¿Qué prefieres?'; }
            if(mode === 'probable') { color = 'var(--cat4)'; label = 'Más Probable'; }

            cardBox.style.borderTop = `5px solid ${color}`;
            catLabel.innerText = label;
            catLabel.style.color = color;

            // Animación de cambio de pantalla
            menuScreen.classList.remove('active');
            menuScreen.classList.add('hide');
            gameScreen.classList.remove('hide');
            gameScreen.classList.add('active');

            // Cargar primera carta
            nextCard();
        }

        // Función para volver al menú
        function goBack() {
            gameScreen.classList.remove('active');
            gameScreen.classList.add('hide');
            menuScreen.classList.remove('hide');
            menuScreen.classList.add('active');
        }

        // Función para mostrar siguiente carta
        function nextCard() {
            // Efecto visual simple
            cardBox.style.transform = "scale(0.95)";
            setTimeout(() => cardBox.style.transform = "scale(1)", 100);

            const list = data[currentMode];
            const randomIndex = Math.floor(Math.random() * list.length);
            const item = list[randomIndex];

            if (currentMode === 'elige') {
                // Formato especial para "Elige"
                cardContent.innerHTML = `
                    <span class="option-a">${item.a}</span>
                    <div class="vs">O</div>
                    <span class="option-b">${item.b}</span>
                `;
            } else {
                // Formato normal para los demás
                cardContent.innerText = item;
            }
        }
    </script>
</body>
</html>
